<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c4c8cd" />
    <title>3D model viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="stage" aria-label="3D model, drag to rotate"></main>

    <nav id="tabs" class="tabs" role="tablist" aria-label="Models" hidden></nav>

    <header class="caption">
      <h1 id="title"></h1>
      <p id="subtitle" hidden></p>
    </header>

    <div id="loader" class="loader" role="status" aria-live="polite">
      <div class="bar"><span id="bar-fill"></span></div>
      <p id="loader-text">Loading model</p>
    </div>

    <p id="hint" class="hint" hidden></p>

    <div id="notice" class="notice" role="alert" hidden>
      <p id="notice-text"></p>
      <button id="notice-close" type="button" aria-label="Dismiss message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
      </button>
    </div>

    <nav class="toolbar" aria-label="View controls" hidden>
      <button id="btn-reset" type="button" aria-label="Reset view" title="Reset view">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4.5h4.5" /></svg>
      </button>
      <button id="btn-rotate" type="button" aria-label="Auto-rotate" title="Auto-rotate" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="3.6" /><path d="M12 3v18M16.5 13.8l2.7 1.4-1.2 2.8" /></svg>
      </button>
      <button id="btn-anim" type="button" aria-label="Pause animation" title="Pause animation" hidden>
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14" /></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" /></svg>
      </button>
      <button id="btn-full" type="button" aria-label="Full screen" title="Full screen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      </button>
    </nav>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
